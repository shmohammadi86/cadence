name: release
on:
  push:
    tags: ["v*"]
jobs:
  draft-release:
    runs-on: [self-hosted, cytohost]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body: |
            Cadence — unsigned beta until code signing lands (see docs/tauri.md).
            Attach the per-OS bundles built locally / by the build workflow.
