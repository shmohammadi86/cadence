[package]
name = "cadence"
version = "0.1.0"
description = "Cadence — Migraine & Cycle Companion (local-first)"
authors = ["Shahin Mohammadi"]
edition = "2021"

[lib]
name = "cadence_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
